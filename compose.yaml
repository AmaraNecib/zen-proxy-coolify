services:
  zen-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      ZEN_PROXY_CONFIG: /config/zen-proxy.json
      PROXY_KEY: ${PROXY_KEY}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      RATE_LIMIT_MAX: "60"
      RATE_LIMIT_WINDOW_MS: "60000"
      TRUST_FORWARDED: "0"
    volumes:
      - zen-config:/config
    expose:
      - "8787"

volumes:
  zen-config:
